<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6955b8">
  <title>HamList · Offline</title>
  <style>
    :root { color-scheme: light; --bg:#fff; --ink:#242237; --muted:#77758d; --line:#ebe9f2; --soft:#f2effa; --brand:#6955b8; }
    :root[data-theme="dark"] { color-scheme: dark; --bg:#11131b; --ink:#f2f3ff; --muted:#aeb4cc; --line:#343a4d; --soft:#302d46; --brand:#a99bff; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at 90% 0%,rgba(121,101,192,.12),transparent 38%),var(--bg); color:var(--ink); font:16px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(100%,480px); padding:clamp(28px,7vw,48px); border:1px solid var(--line); border-radius:28px; background:color-mix(in srgb,var(--bg) 94%,var(--soft)); box-shadow:0 18px 54px rgba(40,32,76,.1); text-align:center; }
    .mark { display:grid; place-items:center; width:64px; height:64px; margin:0 auto 22px; border-radius:22px; background:linear-gradient(135deg,#8975d2,#5c489f); color:#fff; font-size:32px; font-weight:800; }
    .eyebrow { color:var(--brand); font-size:12px; font-weight:700; } h1 { margin:8px 0 10px; font-size:26px; line-height:1.3; } p { margin:0; color:var(--muted); font-size:14px; }
    button { min-height:46px; margin-top:24px; padding:0 20px; border:0; border-radius:14px; background:var(--brand); color:#fff; font:inherit; font-size:14px; font-weight:700; cursor:pointer; }
    button:focus-visible { outline:3px solid #a99bff; outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <span class="eyebrow">HamList · <span data-fa="پیش‌نمایش آفلاین" data-en="Offline preview">پیش‌نمایش آفلاین</span></span>
    <h1 data-fa="اتصال در دسترس نیست" data-en="You’re offline">اتصال در دسترس نیست</h1>
    <p data-fa="فقط دارایی‌های برنامه و این صفحهٔ راهنما در حالت آفلاین در دسترس‌اند؛ تغییرات به سرور ارسال نمی‌شوند." data-en="Only cached app assets and this help page are available offline. Changes are not sent to a server.">فقط دارایی‌های برنامه و این صفحهٔ راهنما در حالت آفلاین در دسترس‌اند؛ تغییرات به سرور ارسال نمی‌شوند.</p>
    <button type="button" onclick="location.reload()" data-fa="تلاش دوباره" data-en="Try again">تلاش دوباره</button>
  </main>
  <script>
    try {
      var lang = localStorage.getItem('hamlist-locale') === 'en' ? 'en' : 'fa';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-fa]').forEach(function (node) { node.textContent = node.getAttribute('data-' + lang); });
      if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
    } catch (_) {}
  </script>
</body>
</html>
