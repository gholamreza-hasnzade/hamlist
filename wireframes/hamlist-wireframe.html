<div class="overlay" id="overlay" aria-hidden="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><h2 id="modalTitle"></h2><p id="modalDescription"></p></div><button class="modal-close" id="closeModal" aria-label="بستن">×</button></div><div id="modalBody"></div></section></div>

<script>
(() => {
  const main = document.getElementById('main');
  const overlay = document.getElementById('overlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalDescription = document.getElementById('modalDescription');
  const modalBody = document.getElementById('modalBody');
  const toast = document.getElementById('toast');
  let language = 'fa';
  let colorTheme = 'light';
  let currentView = 'home';
  let currentList = 'خرید خانه';
  let currentSpace = 'خانه';
  let toastTimer;
  let pendingUndo=null;
  const spaces = [{name:'خانه',emoji:'🏡',members:3},{name:'دوستان',emoji:'🧑‍🤝‍🧑',members:4},{name:'شخصی',emoji:'👤',members:1}];
  const lists = [
    {name:'خرید خانه', emoji:'🛒', space:'خانه', members:3, done:6, total:10, items:[['نان و شیر','۲ عدد · امروز','باز'],['شیر کم‌چرب','۱ بطری · امروز','باز'],['مایع ظرف‌شویی','','باز'],['میوهٔ فصل','اضافه‌شده توسط سارا','باز'],['قهوه','تکمیل‌شده توسط مهدی','done']]},
    {name:'کارهای این هفته', emoji:'🏡', space:'خانه', members:3, done:4, total:7, items:[['آبیاری گلدان‌ها','امروز · مهدی','باز'],['بردن بازیافت','فردا · سارا','باز'],['مرتب‌کردن انباری','','باز']]},
    {name:'سفر آخر هفته', emoji:'✈️', space:'دوستان', members:4, done:2, total:8, items:[['رزرو اقامتگاه','جمعه','باز'],['کارت شناسایی','قبل از حرکت','باز']]}
  ];
  const navNames = {home:['خانه','Home'],spaces:['فضاهای من','My spaces'],tasks:['کارهای من','My tasks'],reminders:['یادآورها','Reminders'],expenses:['هزینه‌های مشترک','Shared expenses'],settings:['تنظیمات حساب','Account settings']};
  const txt = (fa,en) => language==='fa'?fa:en;
  const esc = (value) => String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function notify(message,undo=null){toast.replaceChildren(document.createTextNode(message));pendingUndo=undo;if(undo){const button=document.createElement('button');button.type='button';button.dataset.action='undo-delete';button.textContent=txt('بازگردانی','Undo');toast.append(button)}toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.classList.remove('show');pendingUndo=null},3600)}
  function applyTheme(theme,persist=true){
    colorTheme=theme==='dark'?'dark':'light';
    document.documentElement.dataset.theme=colorTheme;
    const button=document.getElementById('themeButton');
    const label=language==='fa'?(colorTheme==='dark'?'فعال‌کردن حالت روشن':'فعال‌سازی حالت تیره'):(colorTheme==='dark'?'Switch to light mode':'Switch to dark mode');
    button.setAttribute('aria-label',label);button.title=label;
    const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=colorTheme==='dark'?'#17161c':'#f7f1e5';
    if(persist){try{localStorage.setItem('hamlist-theme',colorTheme)}catch(_){}}
  }
  try{colorTheme=localStorage.getItem('hamlist-theme')==='dark'?'dark':'light'}catch(_){}
  function setLanguage(){
    document.documentElement.lang=language;document.documentElement.dir=language==='fa'?'rtl':'ltr';
    document.getElementById('languageButton').textContent=language==='fa'?'EN':'فا';
    document.querySelectorAll('[data-fa][data-en]').forEach(el=>el.textContent=el.dataset[language]);
    document.querySelectorAll('[data-placeholder-fa][data-placeholder-en]').forEach(el=>el.placeholder=el.dataset[`placeholder${language==='fa'?'Fa':'En'}`]);
    applyTheme(colorTheme,false);
    render();
  }
  function heading(title,subtitle,button=''){
    return `<div class="page-heading"><div><p class="eyebrow">${txt('هم‌لیست · فضای مشترک','HAMLIST · SHARED SPACE')}</p><h1>${title}</h1><p>${subtitle}</p></div>${button}</div>`;
  }
  function cardSpace(space){const own=lists.filter(l=>l.space===space.name);const done=own.reduce((n,l)=>n+l.items.filter(i=>i[2]==='done').length,0);const total=own.reduce((n,l)=>n+l.items.length,0);const pct=total?Math.round(done/total*100):0;return `<button class="space-card" data-open-space="${esc(space.name)}"><div class="space-top"><span class="space-emoji">${space.emoji}</span><span class="member-dots"><i>م</i><i>س</i><i>+</i></span></div><h3>${esc(space.name)}</h3><p>${space.members} ${txt('عضو','members')} · ${own.length} ${txt('فهرست','lists')}</p><div class="progress-line"><i style="width:${pct}%"></i></div><div class="space-meta"><span>${done}/${total} ${txt('انجام‌شده','completed')}</span><span>${txt('امروز به‌روز شد','Updated today')}</span></div></button>`}
  function cardList(l){const pct=l.total?Math.round(l.done/l.total*100):0;return `<button class="space-card" data-open-list="${esc(l.name)}"><div class="space-top"><span class="space-emoji">${l.emoji}</span><span class="wire-label">${esc(l.space)}</span></div><h3>${esc(l.name)}</h3><p>${l.items.filter(i=>i[2]!=='done').length} ${txt('مورد باز','open items')}</p><div class="progress-line"><i style="width:${pct}%"></i></div><div class="space-meta"><span>${l.done}/${l.total} ${txt('انجام‌شده','completed')}</span><span>${txt('فهرست مشترک','Shared list')}</span></div></button>`}
  function homeView(){
    const openItems=lists.reduce((n,l)=>n+l.items.filter(i=>i[2]!=='done').length,0);
    return `<section class="welcome-hero"><div class="hero-copy"><span class="hero-kicker"><i></i>${txt('هم‌لیست · فضای مشترک شما','HAMLIST · YOUR SHARED SPACE')}</span><h1>${txt('باهم پیش می‌بریم.','Make it happen together.')}</h1><p>${txt('فهرست‌ها، کارها و برنامه‌های گروهی‌تان؛ مرتب، روشن و همیشه دم‌دست.','Lists, tasks and plans for your people — clear, organised and close at hand.')}</p><div class="hero-actions"><button class="hero-cta" data-action="new-list"><span>＋</span>${txt('ساخت اولین فهرست امروز','Create a list today')}<b>←</b></button><span class="hero-note"><span>✦</span>${txt('برای خانه، دوستان، سفر و هر گروهی','For home, friends, trips and every team')}</span></div></div><div class="hero-art" aria-hidden="true"><div class="hero-glow"></div><div class="hero-orbit orbit-one"></div><div class="hero-orbit orbit-two"></div><div class="hero-list-card"><div class="hero-list-head"><span class="hero-basket">✓</span><span><b>${txt('خرید آخر هفته','Weekend shop')}</b><small>${txt('خانه · ۳ عضو','Home · 3 members')}</small></span><span class="hero-menu">•••</span></div><div class="hero-task"><i class="hero-tick checked">✓</i><span>${txt('قهوه و نان تازه','Coffee & fresh bread')}</span></div><div class="hero-task"><i class="hero-tick checked">✓</i><span>${txt('میوهٔ فصل','Seasonal fruit')}</span></div><div class="hero-task"><i class="hero-tick"></i><span>${txt('گل برای میز','Flowers for the table')}</span></div><div class="hero-progress"><span><i></i></span><small>2/3</small></div></div><div class="hero-float hero-float-top"><span>✦</span>${txt('همکاری، ساده‌تر','Better together')}</div><div class="hero-float hero-float-bottom"><span class="hero-avatar">س</span><span><b>${txt('سارا','Sara')}</b><small>${txt('یک مورد اضافه کرد','added an item')}</small></span><i>＋</i></div></div></section>
      <div class="grid stats"><div class="stat"><div class="stat-label"><span class="stat-symbol">◌</span>${txt('مورد باز','Open items')}</div><div class="stat-value">${openItems}</div><div class="stat-note">${txt('در ۳ فهرست','Across 3 lists')}</div></div><div class="stat"><div class="stat-label"><span class="stat-symbol warm">◷</span>${txt('کارهای امروز','Due today')}</div><div class="stat-value">۳</div><div class="stat-note">${txt('۱ مورد نزدیک موعد','1 approaching deadline')}</div></div><div class="stat"><div class="stat-label"><span class="stat-symbol mint">♧</span>${txt('هم‌گروهی‌ها','Collaborators')}</div><div class="stat-value">۶</div><div class="stat-note">${txt('در ۲ فضای مشترک','In 2 shared spaces')}</div></div></div>
      <div class="section-title"><h2>${txt('فضاهای اخیر','Recent spaces')}</h2><button class="quiet" data-view="spaces">${txt('همهٔ فضاها ←','All spaces →')}</button></div>
      <div class="grid spaces">${spaces.map(cardSpace).join('')}<button class="space-card add-space-card" data-action="new-space"><span class="add-space-icon">＋</span><b>${txt('ساخت فضای تازه','Create a space')}</b><small>${txt('برای هر چیزی که باهم انجام می‌دهید','For anything you do together')}</small></button></div>
      <div class="section-title"><h2>${txt('برای امروز','For today')}</h2><span class="wire-label">${txt('نمونهٔ داده','Sample data')}</span></div>
      <div class="grid bottom-grid"><section class="panel"><div class="panel-head"><h2>${txt('کارهایی که منتظر تو هستند','Waiting for you')}</h2><button class="quiet" data-view="tasks">${txt('مشاهدهٔ همه','View all')}</button></div><div class="item-list">${[['مرتب‌کردن خرید هفتگی','خانه · موعد امروز'],['آماده‌کردن وسایل پیک‌نیک','سفر آخر هفته · موعد فردا'],['پرداخت قبض اینترنت','خانه · ۳ روز دیگر']].map((a,i)=>`<div class="item-row"><button class="check" data-check="${i}" aria-label="${txt('تکمیل کار','Complete task')}"></button><div class="item-main"><div class="item-title">${a[0]}</div><div class="item-sub">${a[1]}</div></div><span class="item-badge ${i===0?'due':''}">${i===0?txt('امروز','Today'):txt('باز','Open')}</span></div>`).join('')}</div></section>
      <section class="panel"><div class="panel-head"><h2>${txt('فعالیت اخیر','Recent activity')}</h2><span class="wire-label">${txt('به‌زودی','Coming soon')}</span></div><div class="activity"><div class="activity-row"><span class="activity-icon">✓</span><span>سارا «میوهٔ فصل» را اضافه کرد<small>در خرید خانه · ۱۲ دقیقه پیش</small></span></div><div class="activity-row"><span class="activity-icon">＋</span><span>مهدی یک فهرست ساخت<small>کارهای این هفته · دیروز</small></span></div><div class="activity-row"><span class="activity-icon">↗</span><span>آرمان به فضای سفر پیوست<small>سفر آخر هفته · دیروز</small></span></div></div></section></div>`;
  }
  function spacesView(){return `${heading(txt('فضاهای من','My spaces'),txt('گروه‌های شخصی و مشترکی که در آن‌ها عضو هستی.','Personal and shared groups you belong to.'),`<button class="primary" data-action="new-space">＋ ${txt('فضای تازه','New space')}</button>`)}<div class="grid spaces">${spaces.map(cardSpace).join('')}<button class="space-card" data-action="join-space" style="border-style:dashed;display:grid;place-items:center;min-height:150px;color:#718078"><span style="font-size:25px;color:#77a58a">↗</span><span style="font-size:12px">${txt('پیوستن با لینک دعوت','Join with invite link')}</span></button><button class="space-card" data-action="new-space" style="border-style:dashed;display:grid;place-items:center;min-height:150px;color:#718078"><span style="font-size:25px;color:#77a58a">＋</span><span style="font-size:12px">${txt('ساخت فضای تازه','Create a space')}</span></button></div>`}
  function spaceView(name){const space=spaces.find(x=>x.name===name)||spaces[0];const groupLists=lists.filter(x=>x.space===space.name);return `${heading(esc(space.name),`${space.members} ${txt('عضو','members')} · ${groupLists.length} ${txt('فهرست','lists')}`,`<button class="primary" data-action="new-list">＋ ${txt('فهرست تازه','New list')}</button>`)}<div class="invite-banner"><p>${txt('این فضا خصوصی است؛ فقط اعضای دعوت‌شده دسترسی دارند.','This space is private; only invited members can access it.')}</p><button class="secondary" data-action="invite">${txt('دعوت هم‌گروهی','Invite someone')}</button></div><div class="section-title"><h2>${txt('فهرست‌های این فضا','Lists in this space')}</h2><span class="wire-label">${txt('مالک: مهدی','Owner: Mahdi')}</span></div><div class="grid spaces">${groupLists.map(cardList).join('')}<button class="space-card" data-action="new-list" style="border-style:dashed;display:grid;place-items:center;min-height:150px;color:#718078"><span style="font-size:25px;color:#77a58a">＋</span><span style="font-size:12px">${txt('ساخت فهرست','Create a list')}</span></button></div><div class="section-title"><h2>${txt('اعضای فضا','Space members')}</h2><button class="quiet" data-action="invite">${txt('مدیریت دعوت‌ها','Manage invites')}</button></div><section class="panel"><div class="activity"><div class="activity-row"><span class="activity-icon">م</span><span>مهدی · ${txt('مالک','Owner')}<small>${txt('شما','You')}</small></span></div><div class="activity-row"><span class="activity-icon">س</span><span>سارا · ${txt('عضو','Member')}<small>${txt('دعوت‌شده','Invited')}</small></span></div></div></section>`}
  function listView(name){const l=lists.find(x=>x.name===name)||lists[0];const space=spaces.find(x=>x.name===l.space)||spaces[0];currentList=l.name;return `<button class="quiet" data-open-space="${esc(space.name)}" style="margin-bottom:8px">← ${esc(space.name)}</button>${heading(esc(l.name),`${txt('فهرست در فضای','List in space')} ${esc(space.name)} · ${space.members} ${txt('عضو','members')}`,`<button class="primary" data-action="new-item">＋ ${txt('افزودن مورد','Add item')}</button>`)}<div class="invite-banner"><p>${txt('این فهرست با اعضای فضای ${esc(l.space)} مشترک است.','This list is shared with the ${esc(l.space)} space members.')}</p><button class="secondary" data-action="invite">${txt('دعوت هم‌گروهی','Invite someone')}</button></div><div class="list-toolbar"><button class="filter-chip active">${txt('همهٔ موارد','All items')}</button><button class="filter-chip">${txt('باز','Open')}</button><button class="filter-chip">${txt('انجام‌شده','Completed')}</button><span class="wire-label">${l.items.filter(i=>i[2]==='done').length}/${l.items.length} ${txt('تکمیل‌شده','completed')}</span></div><section class="panel"><div class="item-list">${l.items.map((item,i)=>`<div class="item-row ${item[2]==='done'?'item-done':''}"><button class="check ${item[2]==='done'?'done':''}" data-listcheck="${i}" aria-label="${txt('تغییر وضعیت','Toggle status')}">${item[2]==='done'?'✓':''}</button><div class="item-main"><div class="item-title">${esc(item[0])}</div>${item[1]?`<div class="item-sub">${esc(item[1])}</div>`:''}</div><span class="item-badge">${item[2]==='done'?txt('انجام‌شده','Done'):txt('باز','Open')}</span><button class="quiet" data-remove="${i}" aria-label="${txt('حذف مورد','Remove item')}">⋯</button></div>`).join('')}</div><button class="secondary" data-action="new-item" style="margin-top:12px">＋ ${txt('مورد تازه','Add another item')}</button></section>`}
  function tasksView(){return `${heading(txt('کارهای من','My tasks'),txt('کارهای واگذارشده و موعدهای نزدیک.','Assigned work and upcoming due dates.'),`<button class="primary" data-action="new-item">＋ ${txt('کار تازه','New task')}</button>`)}<div class="list-toolbar"><button class="filter-chip active">${txt('همه','All')}</button><button class="filter-chip">${txt('امروز','Today')}</button><button class="filter-chip">${txt('این هفته','This week')}</button><button class="filter-chip">${txt('بدون مسئول','Unassigned')}</button></div><section class="panel"><div class="item-list">${[['مرتب‌کردن خرید هفتگی','خانه · امروز · مهدی'],['آماده‌کردن وسایل پیک‌نیک','سفر آخر هفته · فردا · خودم'],['پرداخت قبض اینترنت','خانه · ۳ روز دیگر · سارا'],['مرتب‌کردن انباری','خانه · بدون موعد']].map((a,i)=>`<div class="item-row"><button class="check" data-check="${i}"></button><div class="item-main"><div class="item-title">${a[0]}</div><div class="item-sub">${a[1]}</div></div><span class="item-badge ${i<2?'due':''}">${i<2?txt('نزدیک موعد','Due soon'):txt('باز','Open')}</span></div>`).join('')}</div></section><p class="field-help" style="margin-top:13px">${txt('نمایش نمونه است؛ واگذاری و همگام‌سازی بعداً پیاده می‌شود.','Sample only; assignment and sync are future functionality.')}</p>`}
  function remindersView(){return `${heading(txt('یادآورها','Reminders'),txt('موعدهای مهمت را در یک‌جا ببین.','See important due dates in one place.'),`<button class="primary" data-action="new-reminder">＋ ${txt('یادآور تازه','New reminder')}</button>`)}<div class="grid bottom-grid"><section class="panel"><div class="panel-head"><h2>${txt('به‌زودی','Coming up')}</h2><span class="wire-label">${txt('مرحلهٔ بعد','Later phase')}</span></div><div class="item-list">${[['پرداخت قبض اینترنت','خانه · سه‌شنبه، ۱۰:۰۰'],['خرید داروی ماهانه','شخصی · جمعه، ۱۸:۰۰'],['تأیید رزرو سفر','سفر · ۲ روز دیگر']].map(x=>`<div class="item-row"><span class="activity-icon">◷</span><div class="item-main"><div class="item-title">${x[0]}</div><div class="item-sub">${x[1]}</div></div><button class="secondary" data-action="snooze">${txt('تعویق','Snooze')}</button></div>`).join('')}</div></section><section class="panel"><h2 style="font-size:14px">${txt('تنظیم اعلان‌ها','Notification settings')}</h2><p class="item-sub" style="line-height:1.8">${txt('اعلان مرورگر اختیاری است. اگر اجازه ندهی، یادآور داخل هم‌لیست باقی می‌ماند.','Browser notifications are optional. Reminders remain in HamList if permission is denied.')}</p><button class="secondary" data-action="permission">${txt('تنظیمات اعلان','Notification preferences')}</button></section></div>`}
  function expensesView(){return `${heading(txt('هزینه‌های مشترک','Shared expenses'),txt('ثبت و سهم‌بندی هزینه‌ها؛ بدون انتقال پول.','Track and split expenses; no money is transferred.'),`<button class="primary" data-action="new-expense">＋ ${txt('هزینهٔ تازه','New expense')}</button>`)}<section class="panel"><div class="panel-head"><h2>${txt('خانه · این ماه','Home · this month')}</h2><span class="wire-label">${txt('مرحلهٔ آزمایشی','Later phase')}</span></div><div class="grid stats"><div class="stat"><div class="stat-label">${txt('جمع هزینه‌ها','Total expenses')}</div><div class="stat-value">€ 184</div><div class="stat-note">${txt('نمونهٔ نمایشی','Sample only')}</div></div><div class="stat"><div class="stat-label">${txt('سهم تو','Your share')}</div><div class="stat-value">€ 62</div><div class="stat-note">${txt('۳ عضو مشارکت کرده‌اند','3 members participated')}</div></div><div class="stat"><div class="stat-label">${txt('نیازمند تسویه','To settle')}</div><div class="stat-value">€ 18</div><div class="stat-note">${txt('ثبت دستی؛ پرداخت واقعی نیست','Manual tracking; no real payment')}</div></div></div><table class="simple-table"><thead><tr><th>${txt('شرح','Description')}</th><th>${txt('پرداخت‌کننده','Paid by')}</th><th>${txt('مبلغ','Amount')}</th><th>${txt('وضعیت','Status')}</th></tr></thead><tbody><tr><td>خرید هفتگی</td><td>مهدی</td><td>€ 48</td><td><span class="status-pill">ثبت‌شده</span></td></tr><tr><td>قبض اینترنت</td><td>سارا</td><td>€ 36</td><td><span class="status-pill wait">تسویه‌نشده</span></td></tr></tbody></table></section>`}
  function settingsView(){return `${heading(txt('حساب و تنظیمات','Account & settings'),txt('زبان، اعلان‌ها و داده‌های حساب.','Language, notifications, and account data.'))}<div class="grid bottom-grid"><section class="panel"><div class="panel-head"><h2>${txt('نمایه','Profile')}</h2></div><div class="field"><label>${txt('نام نمایشی','Display name')}</label><input value="مهدی" /></div><div class="field"><label>${txt('ایمیل','Email')}</label><input value="mahdi@example.com" /></div><div class="field"><label>${txt('منطقهٔ زمانی','Time zone')}</label><select><option>Europe/Paris</option><option>Asia/Tehran</option></select></div><button class="primary" data-action="save-settings">${txt('ذخیرهٔ تغییرات','Save changes')}</button></section><section class="panel"><h2 style="font-size:14px">${txt('حریم خصوصی و داده‌ها','Privacy & data')}</h2><p class="item-sub" style="line-height:1.8">${txt('در نسخهٔ واقعی می‌توانی داده‌ها را دریافت یا حساب را حذف کنی. حذف حساب باید مالکیت فضاها را هم حل کند.','In production you can export data or delete your account. Account deletion must resolve space ownership.')}</p><button class="secondary" data-action="export">${txt('درخواست خروجی داده‌ها','Request data export')}</button><button class="danger" data-action="delete-account" style="margin-inline-start:6px">${txt('حذف حساب','Delete account')}</button></section></div>`}
  function render(){
    const viewMap={home:homeView,spaces:spacesView,space:()=>spaceView(currentSpace),list:()=>listView(currentList),tasks:tasksView,reminders:remindersView,expenses:expensesView,settings:settingsView};
    main.innerHTML=viewMap[currentView]?viewMap[currentView]():homeView();
    document.querySelectorAll('[data-view]').forEach(btn=>btn.classList.toggle('active',btn.dataset.view===currentView));
  }
  function openModal(title,description,html){modalTitle.textContent=title;modalDescription.textContent=description;modalBody.innerHTML=html;overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');setTimeout(()=>modalBody.querySelector('input,select')?.focus(),20)}
  function closeModal(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');modalBody.innerHTML=''}
  function newListModal(defaultSpace=currentSpace){openModal(txt('ساخت فهرست تازه','Create a new list'),txt('فهرست به یک فضای خصوصی یا گروهی تعلق می‌گیرد.','Every list belongs to a personal or shared space.'),`<form id="newListForm"><div class="field"><label>${txt('نام فهرست','List name')}</label><input name="name" required maxlength="48" placeholder="${txt('مثلاً خرید خانه','e.g. Groceries')}" /></div><div class="field"><label>${txt('قالب','Template')}</label><select name="template"><option value="shopping">${txt('فهرست خرید','Shopping list')}</option><option value="home">${txt('کارهای خانه','Household tasks')}</option><option value="trip">${txt('سفر یا رویداد','Trip or event')}</option><option value="blank">${txt('خالی','Blank')}</option></select></div><div class="field"><label>${txt('فضای والد','Space')}</label><select name="space">${spaces.map(space=>`<option value="${esc(space.name)}" ${space.name===defaultSpace?'selected':''}>${esc(space.name)}</option>`).join('')}</select></div><div class="modal-actions"><button type="button" class="secondary" data-modal-close>${txt('لغو','Cancel')}</button><button class="primary">${txt('ساخت فهرست','Create list')}</button></div></form>`)}
  function newSpaceModal(){openModal(txt('ساخت فضای تازه','Create a new space'),txt('فضا برای گروهی از فهرست‌ها و اعضاست.','A space groups lists and members.'),`<form id="newSpaceForm"><div class="field"><label>${txt('نام فضا','Space name')}</label><input name="name" required maxlength="48" placeholder="${txt('مثلاً خانه یا سفر دوستان','e.g. Home or Weekend trip')}" /></div><div class="field"><label>${txt('دسترسی پیش‌فرض','Default access')}</label><select><option>${txt('خصوصی — فقط با دعوت','Private — invite only')}</option></select><span class="field-help">${txt('فضا در جست‌وجوی عمومی نمایش داده نمی‌شود.','This space will not appear in public search.')}</span></div><div class="modal-actions"><button type="button" class="secondary" data-modal-close>${txt('لغو','Cancel')}</button><button class="primary">${txt('ساخت فضا','Create space')}</button></div></form>`)}
  function newItemModal(){openModal(txt('افزودن مورد به «'+currentList+'»','Add to “'+currentList+'”'),txt('عنوان را بنویس؛ جزئیات را می‌توانی بعداً اضافه کنی.','Add a title now; details can be added later.'),`<form id="newItemForm"><div class="field"><label>${txt('عنوان مورد','Item name')}</label><input name="title" required maxlength="100" placeholder="${txt('مثلاً شیر','e.g. Milk')}" /></div><div class="field"><label>${txt('یادداشت (اختیاری)','Note (optional)')}</label><input name="note" maxlength="160" /></div><div class="modal-actions"><button type="button" class="secondary" data-modal-close>${txt('لغو','Cancel')}</button><button class="primary">${txt('افزودن','Add item')}</button></div></form>`)}
  function inviteModal(){openModal(txt('دعوت به فضا','Invite to space'),txt('در نسخهٔ واقعی لینک محدود و قابل لغو خواهد بود.','In production, this link will be scoped and revocable.'),`<div class="field"><label>${txt('نقش','Role')}</label><select><option>${txt('عضو — مشاهده و ویرایش','Member — view and edit')}</option><option>${txt('فقط مشاهده','View only')}</option></select></div><div class="field"><label>${txt('لینک دعوت نمونه','Sample invite link')}</label><div class="invite-link" id="inviteLink">https://hamlist.example/invite/8F3K-2Q</div><span class="field-help">${txt('این لینک نمایشی است و عضویت واقعی ایجاد نمی‌کند.','This is a mock link and does not create membership.')}</span></div><div class="modal-actions"><button type="button" class="secondary" data-modal-close>${txt('بستن','Close')}</button><button type="button" class="primary" data-action="copy-invite">${txt('کپی لینک','Copy link')}</button></div>`)}
  function genericModal(kind){
    const cfg={reminder:[txt('یادآور تازه','New reminder'),txt('یادآور نمونه است؛ اعلان واقعی ارسال نمی‌شود.','Sample only; no notification will be sent.'),txt('عنوان یادآور','Reminder title')],expense:[txt('هزینهٔ تازه','New expense'),txt('این فرم فقط نمونهٔ ثبت هزینه است؛ پرداخت انجام نمی‌شود.','Sample only; no payment is processed.'),txt('شرح هزینه','Expense description')],join:[txt('پیوستن به فضا','Join a space'),txt('لینک دعوت را وارد کن.','Enter an invite link.'),txt('لینک دعوت','Invite link')]}[kind];
    openModal(cfg[0],cfg[1],`<form id="genericForm"><div class="field"><label>${cfg[2]}</label><input name="value" required /></div>${kind==='expense'?`<div class="field"><label>${txt('مبلغ و ارز','Amount and currency')}</label><input type="number" min="0" step="0.01" placeholder="0.00 EUR" /></div>`:''}<div class="modal-actions"><button type="button" class="secondary" data-modal-close>${txt('لغو','Cancel')}</button><button class="primary">${txt('ادامه','Continue')}</button></div></form>`)
  }
  document.addEventListener('click',e=>{
    const view=e.target.closest('[data-view]');if(view){currentView=view.dataset.view;render();return}
    const action=e.target.closest('[data-action]')?.dataset.action;
    if(action==='undo-delete'){pendingUndo?.();pendingUndo=null;toast.classList.remove('show');return}if(action==='new-list'){newListModal();return}if(action==='new-space'){newSpaceModal();return}if(action==='new-item'){newItemModal();return}if(action==='invite'){inviteModal();return}if(action==='new-reminder'){genericModal('reminder');return}if(action==='new-expense'){genericModal('expense');return}if(action==='join-space'){genericModal('join');return}
    if(action==='snooze'){notify(txt('یادآور نمونه به تعویق افتاد.','Sample reminder snoozed.'));return}if(action==='permission'){notify(txt('اعلان واقعی در این وایرفریم فعال نیست.','Notifications are not enabled in this wireframe.'));return}if(action==='save-settings'){notify(txt('تغییرات نمونه ذخیره شد.','Sample settings saved.'));return}if(action==='export'){notify(txt('در نسخهٔ واقعی درخواست خروجی ثبت می‌شود.','An export request would be created in production.'));return}if(action==='delete-account'){openModal(txt('حذف حساب','Delete account'),txt('این عمل در نسخهٔ واقعی دائمی و نیازمند تأیید است.','In production this is permanent and requires confirmation.'),`<p>${txt('مالکیت فضاها باید پیش از حذف منتقل شود.','Space ownership must be transferred before deletion.')}</p><div class="modal-actions"><button class="secondary" data-modal-close>${txt('انصراف','Cancel')}</button><button class="danger" data-modal-close>${txt('فهمیدم','Understood')}</button></div>`);return}
    const openSpace=e.target.closest('[data-open-space]');if(openSpace){currentView='space';currentSpace=openSpace.dataset.openSpace;render();return}const openList=e.target.closest('[data-open-list]');if(openList){currentView='list';currentList=openList.dataset.openList;render();return}
    const add=e.target.closest('[data-listcheck]');if(add){const index=Number(add.dataset.listcheck);const l=lists.find(x=>x.name===currentList);if(l&&l.items[index]){l.items[index][2]=l.items[index][2]==='done'?'باز':'done';render()}return}
    const quickCheck=e.target.closest('[data-check]');if(quickCheck){quickCheck.classList.toggle('done');quickCheck.textContent=quickCheck.classList.contains('done')?'✓':'';return}
    const remove=e.target.closest('[data-remove]');if(remove){const index=Number(remove.dataset.remove);const list=lists.find(x=>x.name===currentList);if(list&&list.items[index]){const oldTotal=list.total;const deleted=list.items.splice(index,1)[0];list.total=Math.max(list.items.length,oldTotal-1);render();notify(txt('مورد حذف شد.','Item removed.'),()=>{list.items.splice(Math.min(index,list.items.length),0,deleted);list.total=oldTotal;render()})}return}
    if(e.target.closest('[data-modal-close]')||e.target===overlay){closeModal();return}
    if(e.target.closest('[data-action="copy-invite"]')){const link=document.getElementById('inviteLink')?.textContent||'';navigator.clipboard?.writeText(link).then(()=>notify(txt('لینک نمونه کپی شد.','Sample link copied.'))).catch(()=>notify(txt('لینک را دستی انتخاب و کپی کن.','Select and copy the link manually.')));return}
  });
  document.addEventListener('submit',e=>{
    if(e.target.id==='newListForm'){e.preventDefault();const data=new FormData(e.target);const name=String(data.get('name')||'').trim();const space=String(data.get('space')||spaces[0].name);const template=String(data.get('template')||'blank');if(!name)return;const emoji=template==='shopping'?'🛒':template==='home'?'🏡':template==='trip'?'✈️':'📋';lists.unshift({name,emoji,space,members:1,done:0,total:0,items:[]});closeModal();currentView='list';currentList=name;render();notify(txt('فهرست ساخته شد. این نسخه فقط نمونهٔ مرورگر است.','List created in this browser mockup.'));return}
    if(e.target.id==='newSpaceForm'){e.preventDefault();const name=String(new FormData(e.target).get('name')||'').trim();if(!name)return;if(spaces.some(space=>space.name.toLocaleLowerCase()===name.toLocaleLowerCase())){notify(txt('فضایی با این نام از قبل هست.','A space with this name already exists.'));return}spaces.unshift({name,emoji:'✨',members:1});closeModal();currentSpace=name;currentView='space';render();notify(txt('فضای خصوصی ساخته شد؛ می‌توانی بعداً دعوت بفرستی.','Private space created; you can invite people next.'));return}
    if(e.target.id==='newItemForm'){e.preventDefault();const title=new FormData(e.target).get('title').trim();const l=lists.find(x=>x.name===currentList);if(l&&title){l.items.unshift([title,txt('همین حالا اضافه شد','Added just now'),'باز']);l.total++;closeModal();render();notify(txt('مورد به فهرست اضافه شد.','Item added to the list.'))}return}
    if(e.target.id==='genericForm'){e.preventDefault();closeModal();notify(txt('این جریان در وایرفریم نمایشی است.','This flow is a wireframe only.'))}
  });
  document.getElementById('languageButton').addEventListener('click',()=>{language=language==='fa'?'en':'fa';setLanguage()});
  document.getElementById('themeButton').addEventListener('click',()=>applyTheme(colorTheme==='light'?'dark':'light'));
  applyTheme(colorTheme,false);
  document.getElementById('installButton').addEventListener('click',()=>notify(txt('این فقط پیش‌نمایش نصب PWA است؛ نسخهٔ نهایی پس از افزودن manifest و service worker نصب‌پذیر می‌شود.','This is only the PWA install preview; the production app will be installable after adding its manifest and service worker.')));
  document.getElementById('closeModal').addEventListener('click',closeModal);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  render();
})();
</script>
</body>
</html>
